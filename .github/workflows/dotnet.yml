# Workflow pour construire un projet VSTO / .NET Framework sur windows-latest
name: VSTO CI Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    env:
      Solution_Name: OutlookLMStudio.csproj

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild (adds MSBuild to PATH)
        uses: microsoft/setup-msbuild@v2

      - name: Find Visual Studio and set VSToolsPath
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            Write-Error "vswhere.exe not found on runner"
            exit 1
          }
          $installationPath = & $vswhere -latest -products * -property installationPath
          if (-not $installationPath) {
            Write-Error "No Visual Studio installation found via vswhere"
            exit 1
          }
          Write-Host "Found Visual Studio at: $installationPath"
          $vstools = Join-Path $installationPath "MSBuild\Microsoft\VisualStudio\v17.0"
          "VSToolsPath=$vstools" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8
          Write-Host "VSToolsPath set to $vstools"

      - name: Import signing certificate (if provided)
        shell: pwsh
        env:
          PFX_SECRET: ${{ secrets.Base64_Encoded_Pfx }}
          PFX_PASSWORD: ${{ secrets.Pfx_Key }}
        run: |
          if (-not $env:PFX_SECRET -or -not $env:PFX_PASSWORD) {
            Write-Host "No PFX secrets provided; skipping certificate import (will disable signing in CI)."
            exit 0
          }
          try {
            $pfxBytes = [Convert]::FromBase64String($env:PFX_SECRET)
          } catch {
            Write-Error "Base64_Encoded_Pfx is invalid Base64."
            exit 1
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
          $securePwd = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePwd
          if (-not $cert) { Write-Error "Failed to import certificate"; exit 1 }
          Write-Host "Imported cert thumbprint: $($cert.Thumbprint)"
          "SigningCertThumbprint=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8
          "IMPORTED_PFX_PATH=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Restore with MSBuild (if project supports it)
        shell: pwsh
        env:
          VSToolsPath: ${{ env.VSToolsPath }}
        run: |
          $solution = "${{ env.Solution_Name }}"
          Write-Host "Running msbuild /t:Restore for $solution"
          & msbuild $solution /t:Restore /p:Configuration=${{ matrix.configuration }} /p:VisualStudioVersion=17.0 /p:VSToolsPath="$env:VSToolsPath" || Write-Host "Restore finished (msbuild may return non-zero for some project types)"

      - name: Build with MSBuild (verbose log)
        shell: pwsh
        env:
          VSToolsPath: ${{ env.VSToolsPath }}
          SigningCertThumbprint: ${{ env.SigningCertThumbprint }}
        run: |
          $config = "${{ matrix.configuration }}"
          $solution = "${{ env.Solution_Name }}"
          $log = Join-Path $env:RUNNER_TEMP 'msbuild.log'
          Write-Host "MSBuild starting for $solution ($config)"
          if ($env:SigningCertThumbprint) {
            Write-Host "Using manifest cert thumbprint: $env:SigningCertThumbprint"
            & msbuild $solution /t:Rebuild /p:Configuration=$config /p:VisualStudioVersion=17.0 /p:VSToolsPath="$env:VSToolsPath" /p:ManifestCertificateThumbprint="$env:SigningCertThumbprint" /m /fl /flp:logfile="$log";verbosity=diagnostic
          } else {
            Write-Host "No signing certificate: disabling manifest/assembly signing for CI"
            & msbuild $solution /t:Rebuild /p:Configuration=$config /p:VisualStudioVersion=17.0 /p:VSToolsPath="$env:VSToolsPath" /p:SignManifests=false /p:SignAssembly=false /m /fl /flp:logfile="$log";verbosity=diagnostic
          }
          $exit = $LASTEXITCODE
          Write-Host "MSBuild exit code: $exit"
          if (Test-Path $log) {
            Write-Host "==== Last 200 lines of msbuild.log ===="
            Get-Content $log -Tail 200 | ForEach-Object { Write-Host $_ }
            "MSBUILD_LOG=$log" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8
          } else {
            Write-Host "msbuild.log not found"
          }
          if ($exit -ne 0) { exit $exit }

      - name: Upload MSBuild log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msbuild-log
          path: ${{ env.MSBUILD_LOG }}

      - name: Upload build artifacts (binaries)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: msbuild-binaries-${{ matrix.configuration }}
          path: |
            **/bin/${{ matrix.configuration }}/**
            **/obj/${{ matrix.configuration }}/**

      - name: Cleanup imported certificate and temporary pfx
        if: always()
        shell: pwsh
        run: |
          if ($env:SigningCertThumbprint) {
            Write-Host "Removing imported cert with thumbprint $env:SigningCertThumbprint"
            Get-ChildItem Cert:\CurrentUser\My\ | Where-Object Thumbprint -eq $env:SigningCertThumbprint | Remove-Item -Force -ErrorAction SilentlyContinue
          } else {
            Write-Host "No imported cert to remove"
          }
          if ($env:IMPORTED_PFX_PATH -and (Test-Path $env:IMPORTED_PFX_PATH)) {
            Remove-Item -Path $env:IMPORTED_PFX_PATH -Force -ErrorAction SilentlyContinue
          }
