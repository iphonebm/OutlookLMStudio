name: Build OutlookLMStudio

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.3.1

    - name: Restore NuGet packages
      run: nuget restore OutlookLMStudio.csproj -SolutionDirectory .

    - name: Build solution
      run: msbuild OutlookLMStudio.csproj /p:Configuration=Release
