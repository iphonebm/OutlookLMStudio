name: .NET Core Desktop

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    env:
      Solution_Name: OutlookLMStudio.csproj
      VSTOOLS_PATH: 'C:\Program Files (x86)\Microsoft Visual Studio\2022\Enterprise\MSBuild\Microsoft\VisualStudio\v17.0'

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Install the .NET Core workload
    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # Add MSBuild to the PATH
    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    - name: Find Visual Studio installation and set VSToolsPath
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        if (-not (Test-Path $vswhere)) {
          Write-Error "vswhere.exe not found"
          exit 1
        }
        $installationPath = & $vswhere -latest -products * -property installationPath
        if (-not $installationPath) {
          Write-Error "No Visual Studio installation found via vswhere"
          exit 1
        }
        Write-Host "Found Visual Studio at: $installationPath"
        $vstools = Join-Path $installationPath "MSBuild\Microsoft\VisualStudio\v17.0"
        # Export to GITHUB_ENV for later steps
        "VSToolsPath=$vstools" | Out-File -Encoding utf8 -FilePath $env:GITHUB_ENV

    - name: Restore (use msbuild restore for old csproj or dotnet restore if appropriate)
      shell: pwsh
      run: |
        msbuild ${{ env.Solution_Name }} /t:Restore /p:Configuration=${{ matrix.configuration }}

    - name: Build with MSBuild (use Visual Studio MSBuild)
      shell: pwsh
      env:
        VSToolsPath: ${{ env.VSToolsPath }}
      run: |
        Write-Host "Using VSToolsPath: $env:VSToolsPath"
        msbuild ${{ env.Solution_Name }} /p:Configuration=${{ matrix.configuration }} /p:VisualStudioVersion=17.0 /p:VSToolsPath="$env:VSToolsPath" /m

    # Create Office Tools directory
    - name: Create Office Tools Directory
      shell: pwsh
      run: |
        $officeToolsPath = "C:\Program Files\dotnet\sdk\9.0.306\Microsoft\VisualStudio\v17.0\OfficeTools"
        New-Item -Path $officeToolsPath -ItemType Directory -Force
        
    # Download and Copy Office Tools targets
    - name: Setup Office Tools
      shell: pwsh
      run: |
        $targetPath = "C:\Program Files\dotnet\sdk\9.0.306\Microsoft\VisualStudio\v17.0\OfficeTools"
        Invoke-WebRequest -Uri "https://raw.githubusercontent.com/microsoft/VSSDK-Extensibility-Samples/master/OfficeTools/Microsoft.VisualStudio.Tools.Office.targets" -OutFile "$targetPath\Microsoft.VisualStudio.Tools.Office.targets"

    # Restore dependencies
    - name: Restore dependencies
      run: dotnet restore ${{ env.Solution_Name }}

    # Build the project
    - name: Build
      run: dotnet build ${{ env.Solution_Name }} --configuration ${{ matrix.configuration }} --no-restore
      env:
        VSToolsPath: 'C:\Program Files\dotnet\sdk\9.0.306\Microsoft\VisualStudio\v17.0'

    # Upload build artifacts
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.configuration }}-build
        path: |
          **/bin/${{ matrix.configuration }}/**
          **/obj/${{ matrix.configuration }}/**
