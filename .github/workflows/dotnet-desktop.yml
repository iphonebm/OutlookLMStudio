name: Build OutlookLMStudio

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Check for Office Interop
      run: |
        if (-not (Test-Path "C:/Program Files (x86)/Microsoft Office")) {
          Write-Host "Microsoft Office is not installed on the runner. Skipping build."
          exit 0
        }

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.3.1

    - name: Restore NuGet packages
      run: nuget restore OutlookLMStudio/OutlookLMStudio.csproj

    - name: Build solution
      run: msbuild OutlookLMStudio/OutlookLMStudio.csproj /p:Configuration=Release
